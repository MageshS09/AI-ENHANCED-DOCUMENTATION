services:
  - type: web
    name: ai-doc-generator-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_REQUESTS
        value: 5
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 3600
      - key: TRUSTED_PROXY_COUNT
        value: 1
